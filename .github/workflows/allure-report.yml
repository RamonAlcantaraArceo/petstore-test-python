name: Publish Allure Report

# Reusable workflow – call from any repo that uploads allure-results-* artifacts.
#
# Usage example (in your CI workflow):
#
#   allure-report:
#     name: Publish Allure Report
#     needs: [api-tests, integration-tests, ...]
#     if: always()
#     permissions:
#       contents: write
#       pages: write
#       id-token: write
#       pull-requests: write
#       checks: write
#     uses: RamonAlcantaraArceo/petstore-test-python/.github/workflows/allure-report.yml@main
#     with:
#       publish-report: true
#     secrets: inherit

on:
  workflow_call:
    inputs:
      allure-report-name:
        description: "Name of the generated Allure report (used in report metadata and PR comment)."
        required: true
        default: "Allure Report"
        type: string

      artifact-pattern:
        description: >
          Glob pattern matching the Allure result artifacts to download.
          Must match the artifact names uploaded by test jobs.
        required: false
        default: "allure-results-*"
        type: string

      allure-config:
        description: >
          Path (relative to repo root) to an allurerc.yml config file.
          Skipped automatically if the file does not exist in the calling repo.
        required: false
        default: "allurerc.yml"
        type: string

      history-limit:
        description: "Number of past builds to keep in the trend chart."
        required: false
        default: 20
        type: number

      report-subpath:
        description: "Subdirectory inside the published site for this report. Empty means root."
        required: false
        default: ""
        type: string

      publish-report:
        description: "Deploy the generated report to GitHub Pages."
        required: false
        default: true
        type: boolean

    secrets:
      GH_PAGES_TOKEN:
        required: true


jobs:
  publish:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          install-allure: true

      - name: Download all Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: allure-results/
          merge-multiple: true

      - name: Add executor metadata for trend continuity
        run: |
          SUBPATH="${{ inputs.report-subpath }}"
          REPORT_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}${SUBPATH:+/${SUBPATH}}"
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${GITHUB_RUN_NUMBER},
            "buildName": "${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}",
            "buildUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "reportName": "${{ inputs.allure-report-name }}",
            "reportUrl": "${REPORT_URL}/"
          }
          EOF

      - name: Publish Allure report with history
        uses: ./.github/actions/publish-allure-ci-history
        with:
          github-token: ${{ secrets.GH_PAGES_TOKEN }}
          allure-results-path: allure-results
          report-subpath: ${{ inputs.report-subpath }}
          allure-config: ${{ inputs.allure-config }}
          history-limit: ${{ inputs.history-limit }}
          publish-report: ${{ inputs.publish-report }}
