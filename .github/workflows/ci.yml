name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publish_report:
        description: "Publish Allure report to GitHub Pages"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PETSTORE_API_BASE_URL: "http://localhost:8000/api/v1"
  PETSTORE_UI_BASE_URL: "https://the-internet.herokuapp.com"
  PETSTORE_API_KEY: ${{ secrets.PETSTORE_API_KEY }}
  # UI tests are opt-in; set to "1" in a separate workflow or matrix leg
  RUN_UI_TESTS: "0"
  PYTHONUNBUFFERED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # --------------------------------------------------------------------------
  # Lint & type-check
  # --------------------------------------------------------------------------
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Run ruff (lint)
        run: uv run ruff check .

      - name: Run black (format check)
        run: uv run black --check .

      - name: Run mypy (type check)
        run: uv run mypy framework/

  # --------------------------------------------------------------------------
  # API tests
  # --------------------------------------------------------------------------
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      petstore:
        image: ghcr.io/ramonalcantaraarceo/petstore-api:latest
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Run API tests with coverage
        run: |
          uv run pytest \
            --junitxml=junit-api.xml -o junit_family=legacy \
            tests/api/ \
            tests/api_client/ \
            -m "api" \
            --cov=framework \
            --cov-report=xml:coverage-api.xml \
            --cov-report=term-missing \
            --alluredir=allure-results/api \
            -v

      - name: Upload API test results and coverage
        uses: ./.github/actions/upload-results
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          junit-file: junit-api.xml
          coverage-file: coverage-api.xml
          codecov-flags: api
          allure-results-path: allure-results/api/
          allure-artifact-name: allure-results-api

  # --------------------------------------------------------------------------
  # Integration tests
  # --------------------------------------------------------------------------
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      petstore:
        image: ghcr.io/ramonalcantaraarceo/petstore-api:latest
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Run integration tests with coverage
        run: |
          uv run pytest \
            --junitxml=junit-integration.xml -o junit_family=legacy \
            tests/integration/ \
            tests/integration_client/ \
            -m "integration" \
            --cov=framework \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            --alluredir=allure-results/integration \
            -v

      - name: Upload integration test results and coverage
        uses: ./.github/actions/upload-results
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          junit-file: junit-integration.xml
          coverage-file: coverage-integration.xml
          codecov-flags: integration
          allure-results-path: allure-results/integration/
          allure-artifact-name: allure-results-integration

  # --------------------------------------------------------------------------
  # E2E tests
  # --------------------------------------------------------------------------
  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      petstore:
        image: ghcr.io/ramonalcantaraarceo/petstore-api:latest
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Run E2E tests with coverage
        run: |
          uv run pytest \
            --junitxml=junit-e2e.xml -o junit_family=legacy \
            tests/e2e/ \
            tests/e2e_client/ \
            -m "e2e" \
            --cov=framework \
            --cov-report=xml:coverage-e2e.xml \
            --cov-report=term-missing \
            --alluredir=allure-results/e2e \
            -v

      - name: Upload E2E test results and coverage
        uses: ./.github/actions/upload-results
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          junit-file: junit-e2e.xml
          coverage-file: coverage-e2e.xml
          codecov-flags: e2e
          allure-results-path: allure-results/e2e/
          allure-artifact-name: allure-results-e2e

  # --------------------------------------------------------------------------
  # UI tests (Selenium – runs headless with Chrome)
  # --------------------------------------------------------------------------
  ui-tests:
    name: UI tests (Selenium)
    runs-on: ubuntu-latest
    needs: lint
    env:
      RUN_UI_TESTS: "1"

    services:
      petstore:
        image: ghcr.io/ramonalcantaraarceo/petstore-api:latest
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          install-chrome: true

      - name: Run UI tests
        run: |
          uv run pytest \
            tests/ui/ \
            --junitxml=junit-ui.xml -o junit_family=legacy \
            -m "ui" \
            --alluredir=allure-results/ui \
            -v
        env:
          HEADLESS: "true"

      - name: Upload UI test results and coverage
        uses: ./.github/actions/upload-results
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          junit-file: junit-ui.xml
          coverage-file: coverage-ui.xml
          codecov-flags: ui
          allure-results-path: allure-results/ui/
          allure-artifact-name: allure-results-ui

  # --------------------------------------------------------------------------
  # Publish Allure Report
  # --------------------------------------------------------------------------
  allure-report:
    name: Publish Allure Report
    needs: [api-tests, integration-tests, e2e-tests, ui-tests]
    if: always()
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: write
      checks: write
    uses: RamonAlcantaraArceo/petstore-test-python/.github/workflows/allure-report.yml@reuse-actions
    with:
      allure-report-name: "Petstore Test Report"
      publish-report: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_report == 'true' }}
    secrets:
      GH_PAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
