name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publish_report:
        description: "Publish Allure report to GitHub Pages"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PETSTORE_API_BASE_URL: "http://localhost:8000/api/v1"
  PETSTORE_UI_BASE_URL: "https://the-internet.herokuapp.com"
  PETSTORE_API_KEY: ${{ secrets.PETSTORE_API_KEY }}
  # UI tests are opt-in; set to "1" in a separate workflow or matrix leg
  RUN_UI_TESTS: "0"
  PYTHONUNBUFFERED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # --------------------------------------------------------------------------
  # Lint & type-check
  # --------------------------------------------------------------------------
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Run ruff (lint)
        run: uv run ruff check .

      - name: Run black (format check)
        run: uv run black --check .

      - name: Run mypy (type check)
        run: uv run mypy framework/

  # --------------------------------------------------------------------------
  # API tests
  # --------------------------------------------------------------------------
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      petstore:
        image: ghcr.io/ramonalcantaraarceo/petstore-api:latest
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Run API tests with coverage
        run: |
          uv run pytest \
            --junitxml=junit-api.xml -o junit_family=legacy \
            tests/api/ \
            tests/api_client/ \
            -m "api" \
            --cov=framework \
            --cov-report=xml:coverage-api.xml \
            --cov-report=term-missing \
            --alluredir=allure-results/api \
            -v

      - name: Upload API test results and coverage
        uses: ./.github/actions/upload-results
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          junit-file: junit-api.xml
          coverage-file: coverage-api.xml
          flags: api
          allure-path: allure-results/api/
          allure-name: allure-results-api

  # --------------------------------------------------------------------------
  # Integration tests
  # --------------------------------------------------------------------------
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      petstore:
        image: ghcr.io/ramonalcantaraarceo/petstore-api:latest
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Run integration tests with coverage
        run: |
          uv run pytest \
            --junitxml=junit-integration.xml -o junit_family=legacy \
            tests/integration/ \
            tests/integration_client/ \
            -m "integration" \
            --cov=framework \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            --alluredir=allure-results/integration \
            -v

      - name: Upload integration test results and coverage
        uses: ./.github/actions/upload-results
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          junit-file: junit-integration.xml
          coverage-file: coverage-integration.xml
          flags: integration
          allure-path: allure-results/integration/
          allure-name: allure-results-integration

  # --------------------------------------------------------------------------
  # E2E tests
  # --------------------------------------------------------------------------
  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      petstore:
        image: ghcr.io/ramonalcantaraarceo/petstore-api:latest
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Run E2E tests with coverage
        run: |
          uv run pytest \
            --junitxml=junit-e2e.xml -o junit_family=legacy \
            tests/e2e/ \
            tests/e2e_client/ \
            -m "e2e" \
            --cov=framework \
            --cov-report=xml:coverage-e2e.xml \
            --cov-report=term-missing \
            --alluredir=allure-results/e2e \
            -v

      - name: Upload E2E test results and coverage
        uses: ./.github/actions/upload-results
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          junit-file: junit-e2e.xml
          coverage-file: coverage-e2e.xml
          flags: e2e
          allure-path: allure-results/e2e/
          allure-name: allure-results-e2e

  # --------------------------------------------------------------------------
  # UI tests (Selenium – runs headless with Chrome)
  # --------------------------------------------------------------------------
  ui-tests:
    name: UI tests (Selenium)
    runs-on: ubuntu-latest
    needs: lint
    env:
      RUN_UI_TESTS: "1"

    services:
      petstore:
        image: ghcr.io/ramonalcantaraarceo/petstore-api:latest
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          install-chrome: true

      - name: Run UI tests
        run: |
          uv run pytest \
            tests/ui/ \
            --junitxml=junit-ui.xml -o junit_family=legacy \
            -m "ui" \
            --alluredir=allure-results/ui \
            -v
        env:
          HEADLESS: "true"

      - name: Upload UI test results and coverage
        uses: ./.github/actions/upload-results
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          junit-file: junit-ui.xml
          coverage-file: coverage-ui.xml
          flags: ui
          allure-path: allure-results/ui/
          allure-name: allure-results-ui

  # --------------------------------------------------------------------------
  # Publish Allure Report (on main only)
  # --------------------------------------------------------------------------
  allure-report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: [api-tests, integration-tests, e2e-tests, ui-tests]
    if: always()
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          install-allure: true

      - name: Download all Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results/
          merge-multiple: true

      - name: Restore Allure history from gh-pages
        uses: actions/checkout@v6

        with:
          ref: gh-pages
          path: gh-pages-history
        continue-on-error: true

      - name: Restore Allure 3 history file
        run: |
          if [ -f "gh-pages-history/.allure/allure-history.jsonl" ]; then
            mkdir -p .allure
            cp gh-pages-history/.allure/allure-history.jsonl .allure/allure-history.jsonl
            echo "Allure 3 history restored from gh-pages."
          else
            echo "No previous Allure 3 history file found, starting fresh."
          fi

      - name: Add executor metadata for trend continuity
        run: |
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${GITHUB_RUN_NUMBER},
            "buildName": "${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}",
            "buildUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "reportName": "Petstore Test Report",
            "reportUrl": "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          }
          EOF

      - name: Generate Allure report
        run: |
          allure generate allure-results \
            --output allure-report \
            --config allurerc.yml \
            --history-limit 20

      - name: Persist Allure 3 history file in published site
        run: |
          if [ -f ".allure/allure-history.jsonl" ]; then
            mkdir -p allure-report/.allure
            cp .allure/allure-history.jsonl allure-report/.allure/allure-history.jsonl
            echo "Allure 3 history file persisted for next run."
          fi

      - name: Post Allure summary to PR and job summary
        uses: allure-framework/allure-action@v0
        with:
          report-directory: "./allure-report"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          remote-href: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Deploy report to GitHub Pages
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_report == 'true' }}
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Notice Allure Report
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_report == 'true' }}
        run: |
          echo "::notice title=Allure Report::https://ramonalcantaraarceo.github.io/petstore-test-python"
          echo "### 🚀 Allure Report Deployed" >> $GITHUB_STEP_SUMMARY
          echo "[🔗 View Report](https://ramonalcantaraarceo.github.io/petstore-test-python)" >> $GITHUB_STEP_SUMMARY
